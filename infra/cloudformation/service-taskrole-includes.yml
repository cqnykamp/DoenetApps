# TODO: this include is shared by the doenet app task role and the mysql task
# role, so mysql ends up with S3 access to both ${S3AppBucket} (via S3Policy)
# and ${S3MediaBucket} (via MediaS3Policy) that it does not need.
#
# There is probably a better way to do this!!
Policies:
  - PolicyName: SecretsPolicy
    PolicyDocument:
      Statement:
        - Effect: Allow
          Action:
            - "kms:Decrypt"
            - "kms:Encrypt"
            - "kms:ReEncrypt*"
            - "kms:DescribeKey"
            - "kms:GenerateDataKey"
            - "kms:GenerateDataKeyWithoutPlaintext"
            - "ssm:GetParam*"
            - "secretsmanager:GetSecretValue"
          Resource:
            - Ref: EnvironmentKmsKey
            - Fn::Sub: "arn:aws:ssm:*:*:parameter/${EnvironmentName}"
            - Fn::Sub: "arn:aws:ssm:*:*:parameter/${EnvironmentName}/*"
            - Fn::Sub: "arn:aws:secretsmanager:*:*:secret:${EnvironmentName}*"
        - Effect: Allow
          Action:
            - "secretsmanager:ListSecrets"
            - "elasticfilesystem:DescribeMountTargets"
            - "ec2:DescribeAvailabilityZones"
            - "elasticfilesystem:DescribeFileSystems"
          Resource: "*"
  - PolicyName: S3Policy
    PolicyDocument:
      Statement:
        - Effect: Allow
          Action:
            - "s3:Get*"
            - "s3:List*"
            - "s3:PutObject*"
            - "s3-object-lambda:Get*"
            - "s3-object-lambda:List*"
            - "s3-object-lambda:PutObject*"
          Resource:
            - Fn::Sub: "arn:aws:s3:::${S3AppBucket}"
            - Fn::Sub: "arn:aws:s3:::${S3AppBucket}/*"
  - PolicyName: MediaS3Policy
    PolicyDocument:
      Statement:
        - Effect: Allow
          Action:
            - "s3:PutObject"
            - "s3:GetObject"
            - "s3:DeleteObject"
          Resource:
            - Fn::Sub: "arn:aws:s3:::${S3MediaBucket}/*"
  - PolicyName: SESPolicy
    PolicyDocument:
      Statement:
        - Effect: Allow
          Action:
            - "ses:SendEmail*"
          Resource: "*"
